AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Discord LeetCode Bot - Serverless architecture with Lambda, Bedrock, and DynamoDB

Globals:
  Function:
    Timeout: 30
    Runtime: java21
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1

Parameters:
  DiscordPublicKey:
    Type: String
    Description: Discord application public key for signature verification
    NoEcho: true

  DiscordBotToken:
    Type: String
    Description: Discord bot token for sending follow-up messages
    NoEcho: true

  DiscordApplicationId:
    Type: String
    Description: Discord application ID

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

Resources:
  # DynamoDB Table - Single table design for problems and cache metadata
  LeetCodeProblemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub leetcode-problems-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Application
          Value: discord-leetcode-bot
        - Key: Environment
          Value: !Ref Environment

  # Lambda Function for Discord Interactions
  DiscordInteractionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub discord-leetcode-bot-${Environment}
      CodeUri: target/discord-leetcode-bot-1.0.0-SNAPSHOT.jar
      Handler: com.pyrem.leetcodebot.DiscordLambdaHandler::handleRequest
      Description: Handles Discord slash command interactions for LeetCode problems
      Environment:
        Variables:
          DISCORD_PUBLIC_KEY: !Ref DiscordPublicKey
          DISCORD_BOT_TOKEN: !Ref DiscordBotToken
          DISCORD_APPLICATION_ID: !Ref DiscordApplicationId
          DYNAMODB_TABLE_NAME: !Ref LeetCodeProblemsTable
          ENVIRONMENT: !Ref Environment
          BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
          CACHE_EXPIRY_DAYS: "30"
          MIN_PROBLEM_SET_SIZE: "30"
          MAX_PROBLEM_SET_SIZE: "50"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LeetCodeProblemsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0
      Events:
        DiscordWebhook:
          Type: Api
          Properties:
            Path: /discord/interactions
            Method: POST
            RestApiId: !Ref DiscordApiGateway

  # API Gateway for Discord webhook
  DiscordApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub discord-leetcode-api-${Environment}
      StageName: !Ref Environment
      Description: API Gateway for Discord LeetCode Bot interactions
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowMethods: "'POST, OPTIONS'"
        AllowHeaders: "'Content-Type, X-Signature-Ed25519, X-Signature-Timestamp'"
        AllowOrigin: "'*'"

  # CloudWatch Log Group with retention
  DiscordFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/discord-leetcode-bot-${Environment}
      RetentionInDays: 14

Outputs:
  DiscordInteractionEndpoint:
    Description: Discord Interaction Endpoint URL (configure in Discord Developer Portal)
    Value: !Sub https://${DiscordApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/discord/interactions

  DynamoDBTableName:
    Description: DynamoDB table name
    Value: !Ref LeetCodeProblemsTable

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt DiscordInteractionFunction.Arn
