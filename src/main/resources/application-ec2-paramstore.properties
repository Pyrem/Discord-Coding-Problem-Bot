# EC2 Profile with AWS Parameter Store Integration
# Use this profile when deploying to EC2 with IAM role

# Enable AWS Parameter Store
spring.cloud.aws.parameterstore.enabled=true
spring.cloud.aws.parameterstore.prefix=/discord-bot
spring.cloud.aws.parameterstore.profile-separator=_
spring.cloud.aws.parameterstore.fail-fast=true
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}

# Database Configuration - values fetched from Parameter Store
# Parameter Store keys: /discord-bot/db-url, /discord-bot/db-username, /discord-bot/db-password
spring.datasource.url=${db-url:jdbc:postgresql://localhost:5432/leetcode_bot}
spring.datasource.username=${db-username:postgres}
spring.datasource.password=${db-password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings for Production
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Ollama Configuration
# Parameter Store key: /discord-bot/ollama-url (optional)
spring.ai.ollama.base-url=${ollama-url:http://localhost:11434}
spring.ai.ollama.chat.options.model=${ollama-model:llama3.2}
spring.ai.ollama.chat.options.temperature=0.3

# Discord Bot Configuration - fetched from Parameter Store
# Parameter Store key: /discord-bot/discord-token
discord.bot.token=${discord-token}
discord.bot.command.prefix=!

# LeetCode Cache Configuration
leetcode.cache.expiry.days=30
leetcode.problemset.min.size=30
leetcode.problemset.max.size=50

# Logging - Production level
logging.level.com.pyrem.leetcodebot=INFO
logging.level.io.awspring.cloud.parameterstore=INFO
logging.level.org.hibernate.SQL=WARN

# JPA Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
