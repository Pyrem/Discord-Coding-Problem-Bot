# AWS Bedrock Profile - Use managed LLM service instead of Ollama
# Cost: ~$5-10/month for typical Discord bot usage
# Latency: 1-2 seconds (faster than CPU Ollama)
# Zero infrastructure management

# Spring Profile
spring.profiles.active=bedrock

# Database Configuration (same as ec2 profile)
spring.datasource.url=jdbc:postgresql://localhost:5432/leetcode_bot
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# AWS Bedrock Configuration
spring.ai.bedrock.aws.region=${AWS_REGION:us-east-1}
spring.ai.bedrock.aws.access-key=${AWS_ACCESS_KEY_ID:}
spring.ai.bedrock.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Use Claude 3 Haiku (fastest, cheapest Claude model)
spring.ai.bedrock.anthropic.chat.enabled=true
spring.ai.bedrock.anthropic.chat.model=anthropic.claude-3-haiku-20240307-v1:0
spring.ai.bedrock.anthropic.chat.options.temperature=0.3
spring.ai.bedrock.anthropic.chat.options.max-tokens=500

# Alternative: Use Llama via Bedrock (if available in your region)
# spring.ai.bedrock.llama.chat.enabled=true
# spring.ai.bedrock.llama.chat.model=meta.llama3-8b-instruct-v1:0

# Logging
logging.level.com.pyrem.leetcodebot=INFO
logging.level.software.amazon.awssdk=WARN

# Discord Bot Token
discord.bot.token=${DISCORD_BOT_TOKEN:YOUR_DISCORD_BOT_TOKEN_PLACEHOLDER}
