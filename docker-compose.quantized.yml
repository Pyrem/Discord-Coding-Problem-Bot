# Docker Compose configuration using quantized model for better performance
# Use this for cost-optimized deployment with faster inference

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: leetcode-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: leetcode_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama with quantized model (1B parameters instead of 3B)
  # 2x faster inference, 50% less memory
  ollama:
    image: ollama/ollama:latest
    container_name: leetcode-bot-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Note: After first start, exec into container and run:
    # docker exec -it leetcode-bot-ollama ollama pull llama3.2:1b
    # or: docker exec -it leetcode-bot-ollama ollama pull phi3:mini
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leetcode-bot-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ec2
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/leetcode_bot
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434

      # Use quantized model for faster inference
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: llama3.2:1b

      # Reduced memory requirements allow smaller heap
      JAVA_OPTS: -Xmx256m -Xms128m

      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
